name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow only needs to read the repository.
permissions:
  contents: read

# A new push to the same pull request cancels the run it makes obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links-image:
    name: Build Links image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Links.Api/Dockerfile
          # The tag compose.yaml expects, so Compose runs this image instead of building its own.
          tags: shortener-links:dev
          load: true
          cache-from: type=gha,scope=links
          cache-to: type=gha,mode=max,scope=links

      - name: Start PostgreSQL and Links
        run: docker compose up --no-build --wait --wait-timeout 120

      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://localhost:8080/health
          echo
          code=$(curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data '{"url":"https://example.com/"}' \
            http://localhost:8080/links | jq --raw-output .code)
          echo "Created link $code"
          curl --fail --silent --show-error "http://localhost:8080/links/$code"
          echo

      - name: Show container logs
        if: failure()
        run: docker compose logs